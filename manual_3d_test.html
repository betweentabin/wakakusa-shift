<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Manual 3D Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://threejs.org/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div style="margin: 20px;">
        <h2>3D棚表示テスト</h2>
        <button onclick="start3DTest()">3Dテストを開始</button>
        <div id="test-container" style="width: 800px; height: 600px; border: 1px solid #ccc; margin-top: 10px;"></div>
        <div id="log" style="margin-top: 10px; padding: 10px; background: #f0f0f0; height: 200px; overflow-y: scroll;"></div>
    </div>

    <!-- Simulated plot data -->
    <div style="display: none;">
        <svg>
            <g class="plot-group" data-plot-id="11">
                <rect class="plot-background" x="50" y="50" width="100" height="80"></rect>
                <g class="shelf-level" data-plot-id="11" data-level="1" data-status="growing" data-crop="ほうれん草"></g>
                <g class="shelf-level" data-plot-id="11" data-level="2" data-status="empty" data-crop="空き"></g>
                <g class="shelf-level" data-plot-id="11" data-level="3" data-status="empty" data-crop="空き"></g>
            </g>
            <g class="plot-group" data-plot-id="12">
                <rect class="plot-background" x="170" y="50" width="100" height="80"></rect>
                <g class="shelf-level" data-plot-id="12" data-level="1" data-status="empty" data-crop="空き"></g>
                <g class="shelf-level" data-plot-id="12" data-level="2" data-status="growing" data-crop="ほうれん草"></g>
                <g class="shelf-level" data-plot-id="12" data-level="3" data-status="empty" data-crop="空き"></g>
            </g>
        </svg>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let shelves = [];

        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += message + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        function start3DTest() {
            log('Testing Three.js availability: ' + (typeof THREE !== 'undefined' ? 'OK' : 'ERROR'));
            log('Testing OrbitControls: ' + (typeof THREE.OrbitControls !== 'undefined' ? 'OK' : 'ERROR'));
            
            const container = document.getElementById('test-container');
            container.innerHTML = '';
            
            try {
                // シーンの初期化
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x87CEEB);
                log('Scene created');
                
                // カメラ
                camera = new THREE.PerspectiveCamera(75, container.offsetWidth / container.offsetHeight, 0.1, 1000);
                camera.position.set(15, 10, 15);
                log('Camera created');
                
                // レンダラー
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(container.offsetWidth, container.offsetHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                container.appendChild(renderer.domElement);
                log('Renderer created and added to DOM');
                
                // OrbitControls
                if (typeof THREE.OrbitControls !== 'undefined') {
                    controls = new THREE.OrbitControls(camera, renderer.domElement);
                    controls.enableDamping = true;
                    controls.dampingFactor = 0.05;
                    log('OrbitControls initialized');
                } else {
                    log('OrbitControls not available');
                }
                
                // ライト
                const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
                scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 10, 5);
                directionalLight.castShadow = true;
                scene.add(directionalLight);
                log('Lighting added');
                
                // 地面
                const groundGeometry = new THREE.PlaneGeometry(50, 50);
                const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x90EE90 });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                scene.add(ground);
                log('Ground added');
                
                // テストキューブ
                const testGeometry = new THREE.BoxGeometry(2, 2, 2);
                const testMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000 });
                const testCube = new THREE.Mesh(testGeometry, testMaterial);
                testCube.position.set(0, 1, 0);
                testCube.castShadow = true;
                scene.add(testCube);
                log('Test cube added');
                
                // 棚の作成をテスト
                testCreateShelves();
                
                // アニメーション開始
                animate();
                log('Animation started');
                
            } catch (error) {
                log('Error: ' + error.message);
            }
        }

        function testCreateShelves() {
            log('Testing shelf creation...');
            shelves = [];
            const plotGroups = document.querySelectorAll('.plot-group');
            log('Found plot groups: ' + plotGroups.length);
            
            plotGroups.forEach((plotGroup, index) => {
                const plotId = plotGroup.dataset.plotId;
                const shelfLevels = plotGroup.querySelectorAll('.shelf-level');
                log(`Plot ${plotId}: found ${shelfLevels.length} shelf levels`);
                
                if (shelfLevels.length === 0) return;
                
                const rect = plotGroup.querySelector('.plot-background');
                if (!rect) {
                    log(`No plot-background found for plot ${plotId}`);
                    return;
                }
                
                const svgX = parseFloat(rect.getAttribute('x'));
                const svgY = parseFloat(rect.getAttribute('y'));
                
                // SVG座標を3D座標に変換
                const x = (svgX - 400) / 40;
                const z = (svgY - 300) / 40;
                
                log(`Plot ${plotId} SVG position: (${svgX}, ${svgY}) -> 3D position: (${x}, 0, ${z})`);
                
                // 棚全体のグループ
                const shelfGroup = new THREE.Group();
                shelfGroup.position.set(x, 0, z);
                
                // 支柱を作成
                const postGeometry = new THREE.BoxGeometry(0.1, shelfLevels.length * 1.5 + 0.5, 0.1);
                const postMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
                
                const postPositions = [
                    [-1.5, shelfLevels.length * 0.75, -0.75],
                    [1.5, shelfLevels.length * 0.75, -0.75],
                    [-1.5, shelfLevels.length * 0.75, 0.75],
                    [1.5, shelfLevels.length * 0.75, 0.75]
                ];
                
                postPositions.forEach(pos => {
                    const post = new THREE.Mesh(postGeometry, postMaterial);
                    post.position.set(pos[0], pos[1], pos[2]);
                    post.castShadow = true;
                    shelfGroup.add(post);
                });
                
                // 各レベルを処理
                shelfLevels.forEach((levelElement, levelIndex) => {
                    const level = levelIndex + 1;
                    const status = levelElement.dataset.status;
                    const cropName = levelElement.dataset.crop;
                    
                    const levelGroup = new THREE.Group();
                    const y = level * 1.5;
                    
                    // 棚板
                    const shelfGeometry = new THREE.BoxGeometry(3, 0.1, 1.5);
                    const shelfMaterial = new THREE.MeshLambertMaterial({ color: 0xDEB887 });
                    const shelf = new THREE.Mesh(shelfGeometry, shelfMaterial);
                    shelf.position.y = y;
                    shelf.castShadow = true;
                    shelf.receiveShadow = true;
                    levelGroup.add(shelf);
                    
                    // 作物（空きでない場合）
                    if (status !== 'empty') {
                        const cropGeometry = new THREE.BoxGeometry(2.5, 0.8, 1.2);
                        let cropColor;
                        
                        switch (status) {
                            case 'growing': cropColor = 0x32CD32; break;
                            case 'harvest_ready': cropColor = 0xFFD700; break;
                            case 'overdue': cropColor = 0xFF4500; break;
                            default: cropColor = 0x90EE90;
                        }
                        
                        const cropMaterial = new THREE.MeshLambertMaterial({ 
                            color: cropColor,
                            transparent: true,
                            opacity: 0.8
                        });
                        
                        const crop = new THREE.Mesh(cropGeometry, cropMaterial);
                        crop.position.set(0, y + 0.5, 0);
                        crop.castShadow = true;
                        levelGroup.add(crop);
                        
                        log(`Level ${level}: ${status} - ${cropName}`);
                    }
                    
                    shelfGroup.add(levelGroup);
                });
                
                scene.add(shelfGroup);
                shelves.push(shelfGroup);
                log(`Added shelf group for plot ${plotId} at position (${x}, 0, ${z}) with ${shelfLevels.length} levels`);
            });
            
            log(`Total shelves created: ${shelves.length}`);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (controls) {
                controls.update();
            }
            
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
    </script>
</body>
</html>
