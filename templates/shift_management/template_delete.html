{% extends "base.html" %}

{% block title %}テンプレート削除{% endblock %}

{% block content %}
<div class="container py-4">
  <h1 class="mb-4">シフトテンプレートの削除</h1>

  <div class="alert alert-danger" role="alert">
    <strong>警告:</strong> このシフトテンプレートを本当に削除しますか？
    <p class="mt-2">この操作は元に戻せません。</p>
    <p>削除するテンプレート: <strong>{{ template.name }}</strong></p>
    {% if template.description %}
    <p>説明: {{ template.description }}</p>
    {% endif %}
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="d-flex justify-content-between">
      <a href="{% url 'shift_management:template_list' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> キャンセル
      </a>
      <button type="submit" class="btn btn-danger">
        <i class="fas fa-trash"></i> 削除
      </button>
    </div>
  </form>
</div>
{% endblock %}
