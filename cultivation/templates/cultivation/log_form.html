{% extends "base.html" %}

{% block title %}栽培ログ追加 - {{ section.name }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">
        栽培ログ追加
        <small class="text-muted">{{ section.name }} - {{ plan.crop.name|default:"未設定" }}</small>
    </h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="mb-3">
            <label for="{{ form.status.id_for_label }}" class="form-label">{{ form.status.label }}</label>
            {{ form.status }}
        </div>

        <div class="mb-3">
            <label for="{{ form.memo.id_for_label }}" class="form-label">{{ form.memo.label }}</label>
            {{ form.memo }}
        </div>

        <div class="mb-3">
            <label for="{{ form.log_image.id_for_label }}" class="form-label">{{ form.log_image.label }}</label>
            {{ form.log_image }}
            <div class="form-text">栽培状況の写真をアップロードできます（任意）</div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">ログを記録</button>
            <a href="{% url 'cultivation:section_detail' section.id %}" class="btn btn-secondary">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}
