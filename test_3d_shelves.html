<!DOCTYPE html>
<html>
<head>
    <title>3D棚表示テスト</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="test-container" style="width: 800px; height: 600px;">
        <!-- テスト用のSVG構造 -->
        <svg style="display: none;">
            <g class="plot-group" data-plot-id="11">
                <rect class="plot-background" x="50" y="50" width="100" height="60"></rect>
                <g class="shelf-level" data-plot-id="11" data-level="1" data-status="growing" data-crop="ほうれん草"></g>
                <g class="shelf-level" data-plot-id="11" data-level="2" data-status="empty" data-crop="空き"></g>
                <g class="shelf-level" data-plot-id="11" data-level="3" data-status="empty" data-crop="空き"></g>
            </g>
            <g class="plot-group" data-plot-id="12">
                <rect class="plot-background" x="170" y="50" width="100" height="60"></rect>
                <g class="shelf-level" data-plot-id="12" data-level="1" data-status="empty" data-crop="空き"></g>
                <g class="shelf-level" data-plot-id="12" data-level="2" data-status="growing" data-crop="ほうれん草"></g>
                <g class="shelf-level" data-plot-id="12" data-level="3" data-status="empty" data-crop="空き"></g>
            </g>
        </svg>
        <div id="three-d-scene" style="width: 100%; height: 100%;"></div>
    </div>

    <script>
        // Three.jsシーンの初期化
        let scene, camera, renderer, controls;
        let shelves = [];

        function init3DTest() {
            console.log('Starting 3D test...');
            console.log('THREE available:', typeof THREE);
            
            const container = document.getElementById('three-d-scene');
            
            // シーンの初期化
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            
            // カメラの設定
            camera = new THREE.PerspectiveCamera(75, container.offsetWidth / container.offsetHeight, 0.1, 1000);
            camera.position.set(15, 10, 15);
            
            // レンダラーの設定
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.offsetWidth, container.offsetHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.gammaOutput = true;
            renderer.gammaFactor = 2.2;
            
            container.appendChild(renderer.domElement);
            
            // OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // ライト
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // 地面
            const groundGeometry = new THREE.PlaneGeometry(50, 50);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x90EE90 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // 棚の作成
            createShelves();
            
            // アニメーション開始
            animate();
        }

        function createShelves() {
            console.log('Creating shelves...');
            shelves = [];
            const plotGroups = document.querySelectorAll('.plot-group');
            console.log('Found plot groups:', plotGroups.length);
            
            plotGroups.forEach((plotGroup, index) => {
                const plotId = plotGroup.dataset.plotId;
                const shelfLevels = plotGroup.querySelectorAll('.shelf-level');
                console.log(`Plot ${plotId}: found ${shelfLevels.length} shelf levels`);
                
                if (shelfLevels.length === 0) return;
                
                const rect = plotGroup.querySelector('.plot-background');
                if (!rect) return;
                
                const svgX = parseFloat(rect.getAttribute('x'));
                const svgY = parseFloat(rect.getAttribute('y'));
                
                // SVG座標を3D座標に変換
                const x = (svgX - 400) / 40;
                const z = (svgY - 300) / 40;
                
                // 棚全体のグループ
                const shelfGroup = new THREE.Group();
                shelfGroup.position.set(x, 0, z);
                
                // 棚の支柱を作成
                createShelfPosts(shelfGroup, shelfLevels.length);
                
                // 各レベルを処理
                shelfLevels.forEach((levelElement, levelIndex) => {
                    const level = levelIndex + 1;
                    const status = levelElement.dataset.status;
                    const cropName = levelElement.dataset.crop;
                    
                    // レベルの板を作成
                    const shelfLevel = createShelfLevel(level, status, cropName, shelfLevels.length);
                    shelfGroup.add(shelfLevel);
                });
                
                scene.add(shelfGroup);
                shelves.push(shelfGroup);
                console.log(`Added shelf group for plot ${plotId} at position (${x}, 0, ${z})`);
            });
            
            console.log(`Total shelves created: ${shelves.length}`);
        }

        function createShelfPosts(shelfGroup, levelCount) {
            const postGeometry = new THREE.BoxGeometry(0.1, levelCount * 1.5 + 0.5, 0.1);
            const postMaterial = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            
            const postPositions = [
                [-1.5, levelCount * 0.75, -0.75],
                [1.5, levelCount * 0.75, -0.75],
                [-1.5, levelCount * 0.75, 0.75],
                [1.5, levelCount * 0.75, 0.75]
            ];
            
            postPositions.forEach(pos => {
                const post = new THREE.Mesh(postGeometry, postMaterial);
                post.position.set(pos[0], pos[1], pos[2]);
                post.castShadow = true;
                shelfGroup.add(post);
            });
        }

        function createShelfLevel(level, status, cropName, totalLevels) {
            const levelGroup = new THREE.Group();
            const y = level * 1.5;
            
            // 棚板
            const shelfGeometry = new THREE.BoxGeometry(3, 0.1, 1.5);
            const shelfMaterial = new THREE.MeshLambertMaterial({ color: 0xDEB887 });
            const shelf = new THREE.Mesh(shelfGeometry, shelfMaterial);
            shelf.position.y = y;
            shelf.castShadow = true;
            shelf.receiveShadow = true;
            levelGroup.add(shelf);
            
            // 作物（空きでない場合）
            if (status !== 'empty') {
                const cropGeometry = new THREE.BoxGeometry(2.5, 0.8, 1.2);
                let cropColor;
                
                switch (status) {
                    case 'growing': cropColor = 0x32CD32; break;
                    case 'harvest_ready': cropColor = 0xFFD700; break;
                    case 'overdue': cropColor = 0xFF4500; break;
                    default: cropColor = 0x90EE90;
                }
                
                const cropMaterial = new THREE.MeshLambertMaterial({ 
                    color: cropColor,
                    transparent: true,
                    opacity: 0.8
                });
                
                const crop = new THREE.Mesh(cropGeometry, cropMaterial);
                crop.position.set(0, y + 0.5, 0);
                crop.castShadow = true;
                levelGroup.add(crop);
            }
            
            return levelGroup;
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (controls) {
                controls.update();
            }
            
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        // テスト開始
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, starting 3D test...');
            init3DTest();
        });
    </script>
</body>
</html>
